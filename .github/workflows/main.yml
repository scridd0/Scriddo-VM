name: Smooth RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==========================================
      # CONFIGURE RDP
      # ==========================================
      - name: Configure RDP
        shell: powershell
        run: |
          Write-Host "Configuring Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Write-Host "RDP configured."

      # ==========================================
      # MAXIMUM PRACTICAL WINDOWS PERFORMANCE
      # ==========================================
      - name: Optimize Windows Performance
        shell: powershell
        run: |

          Write-Host "Applying performance optimizations..."

          # ------------------------------------------
          # Visual effects - performance mode
          # ------------------------------------------

          New-Item `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
            -Name "VisualFXSetting" `
            -Type DWord `
            -Value 2

          # ------------------------------------------
          # Disable transparency
          # ------------------------------------------

          New-Item `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            -Name "EnableTransparency" `
            -Type DWord `
            -Value 0

          # ------------------------------------------
          # Disable animations
          # ------------------------------------------

          New-Item `
            -Path "HKCU:\Control Panel\Desktop\WindowMetrics" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop\WindowMetrics" `
            -Name "MinAnimate" `
            -Value "0"

          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop" `
            -Name "DragFullWindows" `
            -Value "0"

          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop" `
            -Name "MenuShowDelay" `
            -Value "0"

          # ------------------------------------------
          # Disable wallpaper
          # ------------------------------------------

          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop" `
            -Name "Wallpaper" `
            -Value ""

          # ------------------------------------------
          # Disable unnecessary Explorer effects
          # ------------------------------------------

          New-Item `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" `
            -Name "ListviewAlphaSelect" `
            -Type DWord `
            -Value 0

          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" `
            -Name "ListviewShadow" `
            -Type DWord `
            -Value 0

          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" `
            -Name "TaskbarAnimations" `
            -Type DWord `
            -Value 0

          # ------------------------------------------
          # RDP bitmap caching
          # ------------------------------------------

          New-Item `
            -Path "HKCU:\Software\Microsoft\Terminal Server Client" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Terminal Server Client" `
            -Name "BitmapCachePersistEnable" `
            -Type DWord `
            -Value 1

          # ------------------------------------------
          # RDP transport policy
          # ------------------------------------------

          New-Item `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            -Name "SelectTransport" `
            -Type DWord `
            -Value 1

          Write-Host "Windows performance optimization complete."

      # ==========================================
      # POWER PLAN
      # ==========================================
      - name: Configure Performance Power Plan
        shell: powershell
        run: |

          Write-Host "Configuring power settings..."

          powercfg /setactive SCHEME_MIN

          Write-Host "High performance power plan selected."

      # ==========================================
      # DISABLE UNNECESSARY SERVICES
      # ==========================================
      - name: Reduce Background Services
        shell: powershell
        run: |

          Write-Host "Reducing unnecessary background activity..."

          $services = @(
              "DiagTrack",
              "MapsBroker",
              "Fax",
              "RetailDemo"
          )

          foreach ($service in $services) {

              $svc = Get-Service `
                -Name $service `
                -ErrorAction SilentlyContinue

              if ($svc) {

                  try {
                      Stop-Service `
                        -Name $service `
                        -Force `
                        -ErrorAction SilentlyContinue
                  }
                  catch {}

                  try {
                      Set-Service `
                        -Name $service `
                        -StartupType Disabled `
                        -ErrorAction SilentlyContinue
                  }
                  catch {}
              }
          }

          Write-Host "Background service optimization complete."

      # ==========================================
      # CHECK CPU + RAM
      # ==========================================
      - name: Check Hardware
        shell: powershell
        run: |

          $computer = Get-CimInstance Win32_ComputerSystem

          $ramGB = [math]::Round(
              $computer.TotalPhysicalMemory / 1GB,
              2
          )

          $cpu = Get-CimInstance Win32_Processor |
            Select-Object -First 1

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "RUNNER HARDWARE"
          Write-Host "=========================================="

          Write-Host "CPU: $($cpu.Name)"
          Write-Host "Logical processors: $($cpu.NumberOfLogicalProcessors)"
          Write-Host "RAM: $ramGB GB"

          Write-Host "=========================================="

          if ($ramGB -lt 32) {
              Write-Warning "Runner has less than 32 GB RAM."
              Write-Warning "RAM cannot be increased by this workflow."
          }

      # ==========================================
      # CREATE 512 GB F:
      # ==========================================
      - name: Create 512GB F Drive
        shell: powershell
        run: |

          $vhdPath = "C:\512GB-RDP-Disk.vhdx"

          if (Get-Volume -DriveLetter F -ErrorAction SilentlyContinue) {
              Write-Error "F: is already in use."
              exit 1
          }

          if (Test-Path $vhdPath) {
              Remove-Item $vhdPath -Force
          }

          New-VHD `
            -Path $vhdPath `
            -SizeBytes 512GB `
            -Dynamic `
            -ErrorAction Stop

          $disk = Mount-VHD `
            -Path $vhdPath `
            -Passthru `
            -ErrorAction Stop

          Start-Sleep -Seconds 2

          $diskNumber = $disk.DiskNumber

          Initialize-Disk `
            -Number $diskNumber `
            -PartitionStyle GPT `
            -ErrorAction Stop

          $partition = New-Partition `
            -DiskNumber $diskNumber `
            -UseMaximumSize `
            -DriveLetter F

          Format-Volume `
            -Partition $partition `
            -FileSystem NTFS `
            -NewFileSystemLabel "RDP-512GB" `
            -Confirm:$false

          Write-Host "F: ready."

      # ==========================================
      # CREATE 2 TB E:
      # ==========================================
      - name: Create 2TB E Drive
        shell: powershell
        run: |

          $vhdPath = "C:\2TB-RDP-Disk.vhdx"

          if (Get-Volume -DriveLetter E -ErrorAction SilentlyContinue) {
              Write-Error "E: is already in use."
              exit 1
          }

          if (Test-Path $vhdPath) {
              Remove-Item $vhdPath -Force
          }

          New-VHD `
            -Path $vhdPath `
            -SizeBytes 2TB `
            -Dynamic `
            -ErrorAction Stop

          $disk = Mount-VHD `
            -Path $vhdPath `
            -Passthru `
            -ErrorAction Stop

          Start-Sleep -Seconds 2

          $diskNumber = $disk.DiskNumber

          Initialize-Disk `
            -Number $diskNumber `
            -PartitionStyle GPT `
            -ErrorAction Stop

          $partition = New-Partition `
            -DiskNumber $diskNumber `
            -UseMaximumSize `
            -DriveLetter E

          Format-Volume `
            -Partition $partition `
            -FileSystem NTFS `
            -NewFileSystemLabel "RDP-2TB" `
            -Confirm:$false

          Write-Host "E: ready."

      # ==========================================
      # CREATE 5 TB G:
      # ==========================================
      - name: Create 5TB G Drive
        shell: powershell
        run: |

          $vhdPath = "C:\5TB-RDP-Disk.vhdx"

          if (Get-Volume -DriveLetter G -ErrorAction SilentlyContinue) {
              Write-Error "G: is already in use."
              exit 1
          }

          if (Test-Path $vhdPath) {
              Remove-Item $vhdPath -Force
          }

          New-VHD `
            -Path $vhdPath `
            -SizeBytes 5TB `
            -Dynamic `
            -ErrorAction Stop

          $disk = Mount-VHD `
            -Path $vhdPath `
            -Passthru `
            -ErrorAction Stop

          Start-Sleep -Seconds 2

          $diskNumber = $disk.DiskNumber

          Initialize-Disk `
            -Number $diskNumber `
            -PartitionStyle GPT `
            -ErrorAction Stop

          $partition = New-Partition `
            -DiskNumber $diskNumber `
            -UseMaximumSize `
            -DriveLetter G

          Format-Volume `
            -Partition $partition `
            -FileSystem NTFS `
            -NewFileSystemLabel "RDP-5TB" `
            -Confirm:$false

          Write-Host "G: ready."

      # ==========================================
      # VERIFY STORAGE
      # ==========================================
      - name: Verify Storage
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "STORAGE"
          Write-Host "=========================================="

          Get-Volume |
            Where-Object DriveLetter |
            Select-Object `
              DriveLetter,
              FileSystemLabel,
              @{Name="SizeGB";Expression={
                  [math]::Round($_.Size / 1GB,2)
              }},
              @{Name="FreeGB";Expression={
                  [math]::Round($_.SizeRemaining / 1GB,2)
              }} |
            Format-Table -AutoSize

      # ==========================================
      # CREATE RDP USER
      # ==========================================
      - name: Create RDP User
        shell: powershell
        run: |

          $username = "RDP"
          $password = "Scriddo@1"

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existingUser) {

              Set-LocalUser `
                -Name $username `
                -Password $securePass

          }
          else {

              New-LocalUser `
                -Name $username `
                -Password $securePass `
                -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user ready."

      # ==========================================
      # INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        shell: powershell
        run: |

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item `
            $installerPath `
            -Force

          Write-Host "Tailscale installed."

      # ==========================================
      # CONNECT TAILSCALE
      # ==========================================
      - name: Establish Tailscale Connection
        shell: powershell
        run: |

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null

          for ($i = 0; $i -lt 10; $i++) {

              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

              if ($tsIP) {
                  break
              }

              Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP was not assigned."
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale IP: $tsIP"

      # ==========================================
      # VERIFY RDP
      # ==========================================
      - name: Verify RDP Accessibility
        shell: powershell
        run: |

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $result.TcpTestSucceeded) {
              Write-Error "RDP port 3389 is unreachable."
              exit 1
          }

          Write-Host "RDP connectivity successful."

      # ==========================================
      # FINAL INFORMATION
      # ==========================================
      - name: Display RDP Information
        shell: powershell
        run: |

          $computer = Get-CimInstance Win32_ComputerSystem

          $ramGB = [math]::Round(
              $computer.TotalPhysicalMemory / 1GB,
              2
          )

          $cpu = Get-CimInstance Win32_Processor |
            Select-Object -First 1

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "             RDP READY"
          Write-Host "=========================================="

          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: Scriddo@1"
          Write-Host ""
          Write-Host "CPU     : $($cpu.Name)"
          Write-Host "RAM     : $ramGB GB"
          Write-Host "E:      : 2 TB virtual"
          Write-Host "F:      : 512 GB virtual"
          Write-Host "G:      : 5 TB virtual"

          Write-Host "=========================================="

      # ==========================================
      # KEEP RUNNER ALIVE
      # ==========================================
      - name: Maintain Connection
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "              RDP ACTIVE"
          Write-Host "=========================================="

          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: Scriddo@1"
          Write-Host ""
          Write-Host "E: 2 TB virtual"
          Write-Host "F: 512 GB virtual"
          Write-Host "G: 5 TB virtual"
          Write-Host ""
          Write-Host "Performance optimizations enabled."
          Write-Host "=========================================="

          while ($true) {

              Write-Host "[$(Get-Date)] RDP Active"

              Start-Sleep -Seconds 300
          }
