name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==========================================
      # CONFIGURE RDP
      # ==========================================
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service -Name TermService -Force

          Write-Host "RDP configured successfully."

      # ==========================================
      # CHECK AVAILABLE RAM
      # ==========================================
      - name: Check RAM
        shell: powershell
        run: |
          $computerSystem = Get-CimInstance Win32_ComputerSystem

          $ramGB = [math]::Round(
              $computerSystem.TotalPhysicalMemory / 1GB,
              2
          )

          Write-Host "=========================================="
          Write-Host "PHYSICAL RAM"
          Write-Host "=========================================="
          Write-Host "RAM available: $ramGB GB"
          Write-Host "=========================================="

          if ($ramGB -lt 32) {
              Write-Host ""
              Write-Host "NOTE:"
              Write-Host "This GitHub runner does not have 32 GB RAM."
              Write-Host "The workflow cannot increase physical RAM."
          }

      # ==========================================
      # CREATE 512 GB F: DRIVE
      # ==========================================
      - name: Create 512GB F Drive
        shell: powershell
        run: |

          $vhdPath = "C:\512GB-RDP-Disk.vhdx"
          $driveLetter = "F"

          Write-Host "=========================================="
          Write-Host "CREATING 512 GB F: DRIVE"
          Write-Host "=========================================="

          # Check F:
          $existingDrive = Get-Volume `
            -DriveLetter $driveLetter `
            -ErrorAction SilentlyContinue

          if ($existingDrive) {
              Write-Error "F: is already in use."
              exit 1
          }

          # Remove previous VHD if present
          if (Test-Path $vhdPath) {
              Dismount-VHD `
                -Path $vhdPath `
                -ErrorAction SilentlyContinue

              Remove-Item `
                $vhdPath `
                -Force
          }

          # Create dynamic 512 GB VHDX
          New-VHD `
            -Path $vhdPath `
            -SizeBytes 512GB `
            -Dynamic `
            -ErrorAction Stop

          Write-Host "512 GB VHDX created."

          # Mount
          $disk = Mount-VHD `
            -Path $vhdPath `
            -Passthru `
            -ErrorAction Stop

          Start-Sleep -Seconds 3

          $diskNumber = $disk.DiskNumber

          Write-Host "Disk number: $diskNumber"

          # Initialize
          $diskInfo = Get-Disk `
            -Number $diskNumber

          if ($diskInfo.PartitionStyle -eq "RAW") {
              Initialize-Disk `
                -Number $diskNumber `
                -PartitionStyle GPT `
                -ErrorAction Stop
          }

          # Partition
          $partition = New-Partition `
            -DiskNumber $diskNumber `
            -UseMaximumSize `
            -DriveLetter F `
            -ErrorAction Stop

          # Format
          Format-Volume `
            -Partition $partition `
            -FileSystem NTFS `
            -NewFileSystemLabel "RDP-512GB" `
            -Confirm:$false `
            -ErrorAction Stop

          Write-Host "F: successfully created."

      # ==========================================
      # CREATE 2 TB E: DRIVE
      # ==========================================
      - name: Create 2TB E Drive
        shell: powershell
        run: |

          $vhdPath = "C:\2TB-RDP-Disk.vhdx"
          $driveLetter = "E"

          Write-Host "=========================================="
          Write-Host "CREATING 2 TB E: DRIVE"
          Write-Host "=========================================="

          # Check E:
          $existingDrive = Get-Volume `
            -DriveLetter $driveLetter `
            -ErrorAction SilentlyContinue

          if ($existingDrive) {
              Write-Error "E: is already in use."
              exit 1
          }

          # Remove previous VHD if present
          if (Test-Path $vhdPath) {
              Dismount-VHD `
                -Path $vhdPath `
                -ErrorAction SilentlyContinue

              Remove-Item `
                $vhdPath `
                -Force
          }

          # Create dynamic 2 TB VHDX
          New-VHD `
            -Path $vhdPath `
            -SizeBytes 2TB `
            -Dynamic `
            -ErrorAction Stop

          Write-Host "2 TB VHDX created."

          # Mount
          $disk = Mount-VHD `
            -Path $vhdPath `
            -Passthru `
            -ErrorAction Stop

          Start-Sleep -Seconds 3

          $diskNumber = $disk.DiskNumber

          Write-Host "Disk number: $diskNumber"

          # Initialize
          $diskInfo = Get-Disk `
            -Number $diskNumber

          if ($diskInfo.PartitionStyle -eq "RAW") {
              Initialize-Disk `
                -Number $diskNumber `
                -PartitionStyle GPT `
                -ErrorAction Stop
          }

          # Partition
          $partition = New-Partition `
            -DiskNumber $diskNumber `
            -UseMaximumSize `
            -DriveLetter E `
            -ErrorAction Stop

          # Format
          Format-Volume `
            -Partition $partition `
            -FileSystem NTFS `
            -NewFileSystemLabel "RDP-2TB" `
            -Confirm:$false `
            -ErrorAction Stop

          Write-Host "E: successfully created."

      # ==========================================
      # STORAGE CHECK
      # ==========================================
      - name: Verify Storage
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "STORAGE INFORMATION"
          Write-Host "=========================================="

          Get-Volume |
            Where-Object DriveLetter |
            Select-Object `
              DriveLetter,
              FileSystem,
              FileSystemLabel,
              @{Name="SizeGB";Expression={
                  [math]::Round($_.Size / 1GB, 2)
              }},
              @{Name="FreeGB";Expression={
                  [math]::Round($_.SizeRemaining / 1GB, 2)
              }} |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "F: = 512 GB virtual maximum"
          Write-Host "E: = 2 TB virtual maximum"

      # ==========================================
      # CREATE RDP USER
      # ==========================================
      - name: Create RDP User with Secure Password
        shell: powershell
        run: |

          Add-Type -AssemblyName System.Security

          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = (
                  [char[]](33..47) +
                  [char[]](58..64) +
                  [char[]](91..96) +
                  [char[]](123..126)
              )
          }

          $rawPassword = @()

          $rawPassword += $charSet.Upper |
              Get-Random -Count 4

          $rawPassword += $charSet.Lower |
              Get-Random -Count 4

          $rawPassword += $charSet.Number |
              Get-Random -Count 4

          $rawPassword += $charSet.Special |
              Get-Random -Count 4

          $password = -join (
              $rawPassword |
              Sort-Object { Get-Random }
          )

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name "RDP" `
            -Password $securePass `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

          Write-Host "RDP user created."

      # ==========================================
      # INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        shell: powershell
        run: |

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item `
            $installerPath `
            -Force

          Write-Host "Tailscale installed."

      # ==========================================
      # CONNECT TAILSCALE
      # ==========================================
      - name: Establish Tailscale Connection
        shell: powershell
        run: |

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {

              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

              Start-Sleep -Seconds 5

              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned."
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale IP: $tsIP"

      # ==========================================
      # TEST RDP
      # ==========================================
      - name: Verify RDP Accessibility
        shell: powershell
        run: |

          Write-Host "Testing RDP..."

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "RDP port 3389 is not reachable."
              exit 1
          }

          Write-Host "RDP connectivity successful."

      # ==========================================
      # FINAL INFORMATION
      # ==========================================
      - name: Display System Information
        shell: powershell
        run: |

          $ram = Get-CimInstance Win32_ComputerSystem

          $ramGB = [math]::Round(
              $ram.TotalPhysicalMemory / 1GB,
              2
          )

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "             RDP INFORMATION"
          Write-Host "=========================================="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host ""
          Write-Host "RAM     : $ramGB GB"
          Write-Host "F:      : 512 GB virtual"
          Write-Host "E:      : 2 TB virtual"
          Write-Host "=========================================="
          Write-Host ""

      # ==========================================
      # KEEP RDP ALIVE
      # ==========================================
      - name: Maintain Connection
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "             RDP ACTIVE"
          Write-Host "=========================================="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Storage : F: 512 GB virtual"
          Write-Host "Storage : E: 2 TB virtual"
          Write-Host "=========================================="
          Write-Host ""

          while ($true) {

              Write-Host "[$(Get-Date)] RDP Active"

              Start-Sleep -Seconds 300
          }
