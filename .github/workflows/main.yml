name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==========================================
      # CONFIGURE RDP
      # ==========================================
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Write-Host "Configuring Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service `
            -Name TermService `
            -Force

          Write-Host "RDP configured successfully."

      # ==========================================
      # RDP PERFORMANCE OPTIMIZATION
      # ==========================================
      - name: Optimize RDP Performance
        shell: powershell
        run: |
          Write-Host "Optimizing RDP performance..."

          New-Item `
            -Path "HKCU:\Software\Microsoft\Terminal Server Client" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Terminal Server Client" `
            -Name "BitmapCachePersistEnable" `
            -Type DWord `
            -Value 1

          New-Item `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
            -Name "SelectTransport" `
            -Type DWord `
            -Value 1

          New-Item `
            -Path "HKCU:\Control Panel\Desktop" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop" `
            -Name "DragFullWindows" `
            -Value "0"

          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop" `
            -Name "MenuShowDelay" `
            -Value "0"

          New-Item `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer" `
            -Name "NoActiveDesktop" `
            -Type DWord `
            -Value 1

          Write-Host "RDP performance settings applied."

      # ==========================================
      # CHECK RAM
      # ==========================================
      - name: Check RAM
        shell: powershell
        run: |
          $computerSystem = Get-CimInstance Win32_ComputerSystem

          $ramGB = [math]::Round(
              $computerSystem.TotalPhysicalMemory / 1GB,
              2
          )

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "RAM INFORMATION"
          Write-Host "=========================================="
          Write-Host "Physical RAM: $ramGB GB"
          Write-Host "Requested RAM: 32 GB"
          Write-Host "=========================================="

          if ($ramGB -lt 32) {
              Write-Warning "This runner has less than 32 GB physical RAM."
              Write-Warning "The workflow cannot increase physical RAM."
          }
          else {
              Write-Host "32 GB or more RAM is available."
          }

      # ==========================================
      # CREATE 512 GB F:
      # ==========================================
      - name: Create 512GB F Drive
        shell: powershell
        run: |
          $vhdPath = "C:\512GB-RDP-Disk.vhdx"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "CREATING 512 GB F: DRIVE"
          Write-Host "=========================================="

          if (Get-Volume -DriveLetter F -ErrorAction SilentlyContinue) {
              Write-Error "F: is already in use."
              exit 1
          }

          if (Test-Path $vhdPath) {
              Dismount-VHD `
                -Path $vhdPath `
                -ErrorAction SilentlyContinue

              Remove-Item `
                $vhdPath `
                -Force
          }

          New-VHD `
            -Path $vhdPath `
            -SizeBytes 512GB `
            -Dynamic `
            -ErrorAction Stop

          $disk = Mount-VHD `
            -Path $vhdPath `
            -Passthru `
            -ErrorAction Stop

          Start-Sleep -Seconds 3

          $diskNumber = $disk.DiskNumber

          $diskInfo = Get-Disk `
            -Number $diskNumber

          if ($diskInfo.PartitionStyle -eq "RAW") {
              Initialize-Disk `
                -Number $diskNumber `
                -PartitionStyle GPT `
                -ErrorAction Stop
          }

          $partition = New-Partition `
            -DiskNumber $diskNumber `
            -UseMaximumSize `
            -DriveLetter F `
            -ErrorAction Stop

          Format-Volume `
            -Partition $partition `
            -FileSystem NTFS `
            -NewFileSystemLabel "RDP-512GB" `
            -Confirm:$false `
            -ErrorAction Stop

          Write-Host "F: created successfully."

      # ==========================================
      # CREATE 2 TB E:
      # ==========================================
      - name: Create 2TB E Drive
        shell: powershell
        run: |
          $vhdPath = "C:\2TB-RDP-Disk.vhdx"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "CREATING 2 TB E: DRIVE"
          Write-Host "=========================================="

          if (Get-Volume -DriveLetter E -ErrorAction SilentlyContinue) {
              Write-Error "E: is already in use."
              exit 1
          }

          if (Test-Path $vhdPath) {
              Dismount-VHD `
                -Path $vhdPath `
                -ErrorAction SilentlyContinue

              Remove-Item `
                $vhdPath `
                -Force
          }

          New-VHD `
            -Path $vhdPath `
            -SizeBytes 2TB `
            -Dynamic `
            -ErrorAction Stop

          $disk = Mount-VHD `
            -Path $vhdPath `
            -Passthru `
            -ErrorAction Stop

          Start-Sleep -Seconds 3

          $diskNumber = $disk.DiskNumber

          $diskInfo = Get-Disk `
            -Number $diskNumber

          if ($diskInfo.PartitionStyle -eq "RAW") {
              Initialize-Disk `
                -Number $diskNumber `
                -PartitionStyle GPT `
                -ErrorAction Stop
          }

          $partition = New-Partition `
            -DiskNumber $diskNumber `
            -UseMaximumSize `
            -DriveLetter E `
            -ErrorAction Stop

          Format-Volume `
            -Partition $partition `
            -FileSystem NTFS `
            -NewFileSystemLabel "RDP-2TB" `
            -Confirm:$false `
            -ErrorAction Stop

          Write-Host "E: created successfully."

      # ==========================================
      # CREATE 5 TB G:
      # ==========================================
      - name: Create 5TB G Drive
        shell: powershell
        run: |
          $vhdPath = "C:\5TB-RDP-Disk.vhdx"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "CREATING 5 TB G: DRIVE"
          Write-Host "=========================================="

          if (Get-Volume -DriveLetter G -ErrorAction SilentlyContinue) {
              Write-Error "G: is already in use."
              exit 1
          }

          if (Test-Path $vhdPath) {
              Dismount-VHD `
                -Path $vhdPath `
                -ErrorAction SilentlyContinue

              Remove-Item `
                $vhdPath `
                -Force
          }

          New-VHD `
            -Path $vhdPath `
            -SizeBytes 5TB `
            -Dynamic `
            -ErrorAction Stop

          $disk = Mount-VHD `
            -Path $vhdPath `
            -Passthru `
            -ErrorAction Stop

          Start-Sleep -Seconds 3

          $diskNumber = $disk.DiskNumber

          $diskInfo = Get-Disk `
            -Number $diskNumber

          if ($diskInfo.PartitionStyle -eq "RAW") {
              Initialize-Disk `
                -Number $diskNumber `
                -PartitionStyle GPT `
                -ErrorAction Stop
          }

          $partition = New-Partition `
            -DiskNumber $diskNumber `
            -UseMaximumSize `
            -DriveLetter G `
            -ErrorAction Stop

          Format-Volume `
            -Partition $partition `
            -FileSystem NTFS `
            -NewFileSystemLabel "RDP-5TB" `
            -Confirm:$false `
            -ErrorAction Stop

          Write-Host "G: created successfully."

      # ==========================================
      # VERIFY STORAGE
      # ==========================================
      - name: Verify Storage
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "STORAGE INFORMATION"
          Write-Host "=========================================="

          Get-Volume |
            Where-Object DriveLetter |
            Select-Object `
              DriveLetter,
              FileSystem,
              FileSystemLabel,
              @{Name="SizeGB";Expression={
                  [math]::Round($_.Size / 1GB, 2)
              }},
              @{Name="FreeGB";Expression={
                  [math]::Round($_.SizeRemaining / 1GB, 2)
              }} |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "E: = 2 TB virtual maximum"
          Write-Host "F: = 512 GB virtual maximum"
          Write-Host "G: = 5 TB virtual maximum"

      # ==========================================
      # CREATE RDP USER
      # ==========================================
      - name: Create RDP User
        shell: powershell
        run: |
          $username = "RDP"
          $password = "Scriddo@1"

          $existingUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existingUser) {
              Write-Host "RDP user already exists. Updating password..."

              $securePass = ConvertTo-SecureString `
                $password `
                -AsPlainText `
                -Force

              Set-LocalUser `
                -Name $username `
                -Password $securePass
          }
          else {
              Write-Host "Creating RDP user..."

              $securePass = ConvertTo-SecureString `
                $password `
                -AsPlainText `
                -Force

              New-LocalUser `
                -Name $username `
                -Password $securePass `
                -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
              Write-Error "User creation failed."
              exit 1
          }

          echo "RDP_CREDS=User: RDP | Password: Scriddo@1" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "RDP USER READY"
          Write-Host "=========================================="
          Write-Host "Username: RDP"
          Write-Host "Password: Scriddo@1"
          Write-Host "=========================================="

      # ==========================================
      # INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item `
            $installerPath `
            -Force

          Write-Host "Tailscale installed."

      # ==========================================
      # CONNECT TAILSCALE
      # ==========================================
      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {

              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

              Start-Sleep -Seconds 5

              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned."
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "Tailscale IP: $tsIP"

      # ==========================================
      # VERIFY RDP
      # ==========================================
      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "Testing RDP connection..."

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "RDP connection failed."
              exit 1
          }

          Write-Host "TCP connectivity successful."

      # ==========================================
      # DISPLAY SYSTEM INFORMATION
      # ==========================================
      - name: Display System Information
        shell: powershell
        run: |
          $system = Get-CimInstance Win32_ComputerSystem

          $ramGB = [math]::Round(
              $system.TotalPhysicalMemory / 1GB,
              2
          )

          $cpu = Get-CimInstance Win32_Processor |
            Select-Object -First 1

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "              RDP INFORMATION"
          Write-Host "=========================================="

          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: Scriddo@1"
          Write-Host ""
          Write-Host "CPU     : $($cpu.Name)"
          Write-Host "RAM     : $ramGB GB"
          Write-Host "E:      : 2 TB virtual"
          Write-Host "F:      : 512 GB virtual"
          Write-Host "G:      : 5 TB virtual"

          Write-Host "=========================================="

      # ==========================================
      # KEEP RDP ALIVE
      # ==========================================
      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "               RDP ACTIVE"
          Write-Host "=========================================="

          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: Scriddo@1"
          Write-Host ""
          Write-Host "E: 2 TB virtual"
          Write-Host "F: 512 GB virtual"
          Write-Host "G: 5 TB virtual"
          Write-Host "=========================================="
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
